<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Voice Assistant</title>
</head>
<body>
  <h1>My First Voice Assistant 🤖</h1>

  <button id="listenBtn">🎤 Talk to Me</button>
  <button id="stopBtn">⏹ Stop Speaking</button>

  <p id="status">Click the button and say something!</p>
  <p><b>You said:</b> <span id="heard">Nothing yet</span></p>
  <p><b>Assistant:</b> <span id="reply">Waiting for you...</span></p>

  <script>
    const listenBtn = document.querySelector('#listenBtn');
    const stopBtn = document.querySelector('#stopBtn');
    const statusText = document.querySelector('#status');
    const heardText = document.querySelector('#heard');
    const replyText = document.querySelector('#reply');

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      statusText.textContent =
        'Speech recognition is not supported in this browser.';
    } else {
      const recognition = new SpeechRecognition();

      recognition.lang = 'en-US';
      recognition.continuous = false;
      recognition.interimResults = false;

      function speak(text) {
        speechSynthesis.cancel();

        const message = new SpeechSynthesisUtterance(text);
        message.lang = 'en-US';

        speechSynthesis.speak(message);
        replyText.textContent = text;
      }

      function respond(words) {
        const text = words.toLowerCase();
        let answer;

        if (text.includes('hello') || text.includes('hi')) {
          answer = 'Hello bro! Nice to hear your voice!';
        } else if (text.includes('how are you')) {
          answer = 'I am doing great! How are you doing?';
        } else if (text.includes('your name')) {
          answer = 'I am your JavaScript voice assistant.';
        } else if (text.includes('javascript')) {
          answer = 'JavaScript makes websites interactive. You are learning it right now!';
        } else if (text.includes('time')) {
          answer = 'The current time on your computer is ' +
            new Date().toLocaleTimeString();
        } else if (text.includes('thank you')) {
          answer = 'You are welcome, bro!';
        } else if (text.includes('bye')) {
          answer = 'Goodbye bro! Keep coding and never give up!';
        } else {
          answer = 'You said ' + words +
            '. I am still learning how to respond to that.';
        }

        speak(answer);
      }

      listenBtn.addEventListener('click', () => {
        speechSynthesis.cancel();
        statusText.textContent = 'Listening... speak now!';
        recognition.start();
      });

      recognition.onresult = (event) => {
        const words = event.results[0][0].transcript;

        heardText.textContent = words;
        statusText.textContent = 'I heard you!';
        respond(words);
      };

      recognition.onerror = (event) => {
        statusText.textContent =
          'Recognition error: ' + event.error;
      };

      recognition.onend = () => {
        if (statusText.textContent === 'Listening... speak now!') {
          statusText.textContent =
            'No speech detected. Click the button to try again.';
        }
      };

      stopBtn.addEventListener('click', () => {
        speechSynthesis.cancel();
        statusText.textContent = 'Speech stopped.';
      });
    }
  </script>
</body>
</html>
