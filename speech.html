<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Can Talk!</title>
</head>
<body>
  <h1>JavaScript Voice Studio 🎙️</h1>

<select id="voiceSelect">
  <option>Loading voices...</option>
</select>

<br><br>

<textarea id="textInput" rows="4" cols="35">Hello Onyebuchi! Welcome to the world of programming.</textarea>

<br><br>

<button id="speakButton">Speak 🗣️</button>
<button id="stopButton">Stop ⏹️</button>

<script>
  const voiceSelect = document.querySelector('#voiceSelect');
  const textInput = document.querySelector('#textInput');
  const speakButton = document.querySelector('#speakButton');
  const stopButton = document.querySelector('#stopButton');

  let voices = [];

  function loadVoices() {
    voices = speechSynthesis.getVoices();

    voiceSelect.innerHTML = '';

    voices.forEach((voice, index) => {
      const option = document.createElement('option');
      option.value = index;
      option.textContent =
        `${voice.name} (${voice.lang})`;

      voiceSelect.appendChild(option);
    });
  }

  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;

  speakButton.addEventListener('click', () => {
    speechSynthesis.cancel();

    const message =
      new SpeechSynthesisUtterance(textInput.value);

    const selectedVoice = voices[voiceSelect.value];

    if (selectedVoice) {
      message.voice = selectedVoice;
    }

    speechSynthesis.speak(message);
  });

  stopButton.addEventListener('click', () => {
    speechSynthesis.cancel();
  });
</script>
</body>
</html>
