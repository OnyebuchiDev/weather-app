<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="description" content="Check current weather conditions and 5-day forecast for cities around the world.">
  <title>Weather App</title>
   <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div>⛅ Weather App</div>

    <div class="hero">
      <h1>Check the Weather<br> Anywhere in the World</h1>
      <p>Get real-time weather updates for any city.</p>
      <p>Simple, fast and accurate.</p>
    </div>

    <div class="search-controls">
  <div class="search-row">
    <input
      class="city-input"
      type="text"
      placeholder="🔍 Enter city name (e.g. Lagos, London...)"
      aria-label="Enter city name"
    >
    <button class="search-button" type="button">Search</button>
  </div>

  <div class="action-row">
    <button class="location-button" type="button">📍 Use Current Location</button>
    <button class="voice-button" type="button">🎙️ Speak to Weather</button>
  </div>

  <p class="voice-status" aria-live="polite"></p>
  <p class="error-message" role="alert"></p>
</div>

  </header>

  <main>
    <section class="current-weather">

      <div class="weather-header">
        <h2>Current Weather</h2>
        <button
         class="unit-toggle"
         type="button">Switch to °F
        </button>
      </div>
      
      <div class="weather-info">
        <h3 class="city-name">weather not loaded</h3>
        <p class="local-time"></p>

        <p class="current-weather-icon">⛅</p>
        <p class="temperature"></p>
        <p class="weather-description">Search for a city to see its weather.</p>
      </div>

      <div class="weather-details">
        <div>
          <p>Feels Like</p>
          <p class="feels-like">-</p>
        </div>

        <div>
          <p>Humidity</p>
          <p class="humidity">-</p>
        </div>

        <div>
          <p>Wind Speed</p>
          <p class="wind-speed">-</p>
        </div>
      </div>
    </section>

    <section class="forecast">
      <h2>5-Day Forecast</h2>
      <div class="forecast-list">
        <!-- Forecast cards will go here -->
      </div>
    </section>
  </main>

  <footer>© 2026 Onyebuchi Agwaraonye</footer>

  <script src="script.js"></script>
  <script src="voice.js"></script>
  
</body>
</html>
