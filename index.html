<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Weather App</title>
   <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div>⛅ Weather App</div>

    <div class="hero">
      <h1>Check the Weather<br> Anywhere in the World</h1>
      <p>Get real-time weather updates for any city.</p>
      <p>Simple, fast and accurate.</p>
    </div>

    <div >
      <input class="city-input" type="text" placeholder=" &#128269; Enter city name(e.g Lagos, London, New York...)  
      "> 
      <button class="search-button">Search</button>
      <p class="error-message"
      role="alert"></p>
    </div>
  </header>

  <main>
    <section class="current-weather">

      <div class="weather-header">
        <h2>Current Weather</h2>
        <button
         class="unit-toggle">Switch to ℉
        </button>
      </div>
      
      <div class="weather-info">
        <h3 class="city-name">Lagos, NG</h3>
        <p class="local-time"></p>

        <p class="current-weather-icon">⛅</p>
        <p class="temperature">28°C</p>
        <p class="weather-description">Partly Cloudy</p>
      </div>

      <div class="weather-details">
        <div>
          <p>Feels Like</p>
          <p class="feels-like">30°C</p>
        </div>

        <div>
          <p>Humidity</p>
          <p class="humidity">75%</p>
        </div>

        <div>
          <p>Wind Speed</p>
          <p class="wind-speed">12 km/h</p>
        </div>
      </div>
    </section>

    <section class="forecast">
      <h2>5-Day Forecast</h2>
      <div class="forecast-list">
        <!-- Forecast cards will go here -->
      </div>
    </section>
  </main>

  <footer>© 2026 Onyebuchi Agwaraonye</footer>

  <script src="script.js"></script>
  
</body>
</html>
